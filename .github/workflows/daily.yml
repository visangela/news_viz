name: Daily AI Industry Dashboard

on:
  schedule:
    # 每天 UTC 17:00 运行（北京时间 01:00）
    - cron: '0 17 * * *'
  workflow_dispatch:   # 支持手动触发调试

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TZ: Asia/Shanghai
        run: python -m scripts.main

      - name: Commit updated data and dist
        run: |
          git config user.name "ai-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily dashboard update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4